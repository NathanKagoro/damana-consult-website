name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build as GitHub Pages will serve it, so subfolder mistakes fail here.
      BASE_PATH: /damana-consult-website/
      SITE_URL: https://nathankagoro.github.io/damana-consult-website/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Screenshots at 1440, 390 and 360 px
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
